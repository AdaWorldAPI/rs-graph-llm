[workspace]
members = [
    "graph-flow",
    "graph-flow-action",   # kgV ActionHandler + cold-path/MUL/hot dispatch (inner: one action)
    "graph-flow-action-ogar", # uplink: OGAR's executor behind the hard gate (commit_via lands first)
    "graph-flow-kanban",   # outer planning-phase envelope: one Rubicon cycle over contract::kanban
    "insurance-claims-service",
    "examples",
    "recommendation-service",
    "medical-document-service",
    # Cognitive Compilation: graph-flow Tasks for the Elixir-template loop
    # (additive; template representation/runtime/compiler live in AdaWorldAPI/lance-graph).
    "crates/template-task",
    # Cognitive Compilation: AriGraph/OSINT episodic arc (the training-wheels half).
    # Additive + isolated (cherry-pickable); drives the rig store adapters.
    "crates/episodic-arc-task",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
thiserror = "2.0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
dashmap = "6.1"
# Bolt to the AdaWorldAPI/rig fork (rig-core 0.39) instead of the crates.io 0.35
# build. The fork carries the SurrealDB-on-Lance (kv-lance) + rig-lancedb store
# adapters the cognitive-compilation loop drives, and keeps the `Message::system`
# constructor graph-flow's chat-history conversion needs.
#
# Aliased to `rig` (package = "rig-core"): the fork's rig-core sets
# `[lib] name = "rig_core"`, whereas crates.io 0.35 used `name = "rig"`, so the
# `use rig::…` call sites only keep resolving if the dependency is imported under
# the name `rig`. The rename fixes that for every member at the Cargo layer.
rig = { git = "https://github.com/AdaWorldAPI/rig", branch = "main", package = "rig-core" }
axum = "0.8.4"
tower = "0.5"
tower-http = { version = "0.6.6", features = ["trace", "cors"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "json", "macros", "uuid"] }
pdf2image = "0.1"
